services:
  mongo:
    image: mongo:7.0
    container_name: mongo_db
    restart: unless-stopped
    ports: 
      - "27018:27017"
    # environment:  
      # - MONGO_INITDB_ROOT_USERNAME=root
      # - MONGO_INITDB_ROOT_PASSWORD=example
    volumes:
      - mongo_data:/data/db
    networks:
      - my_network

  mobius:
    image: cursecatcher/mobius:gridfs 
    pull_policy: always
    # build: 
    #   context: .
    #   dockerfile: Dockerfile
    container_name: mobius
    restart: unless-stopped
    ports:
      - "8501:8501"   # Streamlit example; change if different
    environment:
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      - mongo
    networks:
      - my_network

  # mongo-express:
  #   image: mongo-express:1.0.2
  #   container_name: mongo_express
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - ME_CONFIG_MONGODB_ADMINUSERNAME=root
  #     - ME_CONFIG_MONGODB_ADMINPASSWORD=example
  #     - ME_CONFIG_MONGODB_SERVER=mongo
  #   depends_on:
  #     - mongo

networks:
  my_network:

volumes:
  mongo_data:




